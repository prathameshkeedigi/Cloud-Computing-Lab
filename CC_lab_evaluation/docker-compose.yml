# Library Management System - 4 microservices + Streamlit client
# All containers join the same user-defined bridge network "library-net",
# so services reach each other by service name (Docker's built-in DNS).

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 10

services:
  book-service:
    build: ./services/book_service
    image: library-app/book-service:1.0
    container_name: book-service
    ports:
      - "8001:8001"
    environment:
      DB_PATH: /data/books.db
    volumes:
      - book-data:/data
    networks:
      - library-net
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  member-service:
    build: ./services/member_service
    image: library-app/member-service:1.0
    container_name: member-service
    ports:
      - "8002:8002"
    environment:
      DB_PATH: /data/members.db
    volumes:
      - member-data:/data
    networks:
      - library-net
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]

  notification-service:
    build: ./services/notification_service
    image: library-app/notification-service:1.0
    container_name: notification-service
    ports:
      - "8004:8004"
    environment:
      DB_PATH: /data/notifications.db
    volumes:
      - notification-data:/data
    networks:
      - library-net
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]

  borrow-service:
    build: ./services/borrow_service
    image: library-app/borrow-service:1.0
    container_name: borrow-service
    ports:
      - "8003:8003"
    environment:
      DB_PATH: /data/borrows.db
      BOOK_SERVICE_URL: http://book-service:8001
      MEMBER_SERVICE_URL: http://member-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    volumes:
      - borrow-data:/data
    networks:
      - library-net
    depends_on:
      book-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]

  frontend:
    build: ./frontend
    image: library-app/frontend:1.0
    container_name: library-frontend
    ports:
      - "8501:8501"
    environment:
      BOOK_SERVICE_URL: http://book-service:8001
      MEMBER_SERVICE_URL: http://member-service:8002
      BORROW_SERVICE_URL: http://borrow-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    networks:
      - library-net
    depends_on:
      borrow-service:
        condition: service_healthy

networks:
  library-net:
    name: library-net
    driver: bridge

volumes:
  book-data:
  member-data:
  borrow-data:
  notification-data:
